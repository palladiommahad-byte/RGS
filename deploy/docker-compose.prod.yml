# Production stack for one riad on one VPS: Caddy (HTTPS) -> web + api, Postgres, MinIO,
# nightly backups. Sized to run on a 1 vCPU / 1 GB server (with 2 GB swap, see
# deploy/server-setup.sh); bigger servers simply have room to spare.
#
# Small server (1-2 GB RAM): use the images GitHub builds, never build on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build
# Server with 4 GB+ RAM may build itself instead:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: riad

x-db-url: &db-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

# Docker logs are capped (3 x 10 MB per service) so they never fill a small disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    shm_size: 64m
    # Tuned for a small server: one riad is a few thousand rows a month.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      - -c
      - wal_buffers=4MB
      - -c
      - min_wal_size=64MB
      - -c
      - max_wal_size=256MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  # Private object storage (passport photos, receipts, contracts, invoices) on this server.
  # Switched on with COMPOSE_PROFILES=minio in .env.production. Without it, files go to the
  # S3_* storage set there (Cloudflare R2): needed where the CPU lacks x86-64-v2 (MinIO
  # builds require it), and lighter on a 1 GB server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ['minio']
    restart: unless-stopped
    logging: *logging
    mem_limit: 160m
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # No web console (never exposed anyway), one CPU, and a memory target for Go.
      MINIO_BROWSER: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: 120MiB
    volumes:
      - miniodata:/data

  api:
    image: ${RIAD_IMAGES:-ghcr.io/palladiommahad-byte}/riad-api:${RIAD_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    env_file: .env.production
    environment:
      NODE_ENV: production
      # Heap cap below the container limit: Node collects garbage before Docker kills it.
      NODE_OPTIONS: --max-old-space-size=256
      UV_THREADPOOL_SIZE: '2'
      DATABASE_URL: *db-url
      COOKIE_SECURE: 'true'
      # Trust Caddy (private Docker network) for the client IP used by rate limits.
      TRUST_PROXY: uniquelocal
      CORS_ORIGINS: https://${DOMAIN}
      # MinIO here by default; R2: S3_ENDPOINT = S3_PUBLIC_ENDPOINT = the R2 endpoint.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${FILES_DOMAIN}}
      # The backup secrets are in .env.production for the backup service only: the API
      # never needs them, so a break-in there cannot read or delete the off-site copies.
      BACKUP_PASSPHRASE: ''
      BACKUP_S3_ACCESS_KEY: ''
      BACKUP_S3_SECRET_KEY: ''
    depends_on:
      postgres: { condition: service_healthy }
      # The API creates its buckets in MinIO when it starts.
      minio: { condition: service_started, required: false }
    volumes:
      - ocrcache:/data/ocr

  web:
    image: ${RIAD_IMAGES:-ghcr.io/palladiommahad-byte}/riad-web:${RIAD_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    depends_on: [api]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
      GOMAXPROCS: '1'
      GOMEMLIMIT: 48MiB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  # Nightly backup (database + every stored file) into ./backups, encrypted with
  # BACKUP_PASSPHRASE and copied off the server (BACKUP_S3_*); "Back up now" in Settings too.
  # One backup now (before an upgrade): docker compose ... run --rm backup once
  backup:
    image: ${RIAD_IMAGES:-ghcr.io/palladiommahad-byte}/riad-backup:${RIAD_TAG:-latest}
    build:
      context: ./backup
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    environment: &backup-env
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PASSPORTS: ${S3_BUCKET_PASSPORTS:-riad-passports}
      S3_BUCKET_RECEIPTS: ${S3_BUCKET_RECEIPTS:-riad-receipts}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-riad-documents}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-riad}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      BACKUP_REMOTE_KEEP_MONTHS: ${BACKUP_REMOTE_KEEP_MONTHS:-12}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started, required: false }

  # Restore (see README): docker compose ... --profile restore run --rm restore list
  restore:
    image: ${RIAD_IMAGES:-ghcr.io/palladiommahad-byte}/riad-backup:${RIAD_TAG:-latest}
    profiles: ['restore']
    logging: *logging
    entrypoint: ['/usr/local/bin/restore.sh']
    environment: *backup-env
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  ocrcache:
  caddy_data:
  caddy_config:
