# Production stack for one riad on one VPS: Caddy (HTTPS) -> web + api, Postgres, MinIO,
# nightly backups. Run from this folder:
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: riad

x-db-url: &db-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  # Private object storage (passport photos, receipts, contracts, invoices).
  # To use Cloudflare R2 instead: remove minio (and the api's depends_on it), create the
  # three buckets in R2, set S3_* in .env.production.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: riad-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      COOKIE_SECURE: 'true'
      # Trust Caddy (private Docker network) for the client IP used by rate limits.
      TRUST_PROXY: uniquelocal
      CORS_ORIGINS: https://${DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
      # The API creates its buckets in MinIO when it starts.
      minio: { condition: service_started }
    volumes:
      - ocrcache:/data/ocr

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    image: riad-web:latest
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  # Nightly backup (database + every stored file) into ./backups, encrypted with
  # BACKUP_PASSPHRASE and copied off the server (BACKUP_S3_*); "Back up now" in Settings too.
  # One backup now (before an upgrade): docker compose ... run --rm backup once
  backup:
    build:
      context: ./backup
    image: riad-backup:latest
    restart: unless-stopped
    environment: &backup-env
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PASSPORTS: ${S3_BUCKET_PASSPORTS:-riad-passports}
      S3_BUCKET_RECEIPTS: ${S3_BUCKET_RECEIPTS:-riad-receipts}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-riad-documents}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-riad}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      BACKUP_REMOTE_KEEP_MONTHS: ${BACKUP_REMOTE_KEEP_MONTHS:-12}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  # Restore (see README): docker compose ... --profile restore run --rm restore list
  restore:
    image: riad-backup:latest
    profiles: ['restore']
    entrypoint: ['/usr/local/bin/restore.sh']
    environment: *backup-env
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  ocrcache:
  caddy_data:
  caddy_config:
