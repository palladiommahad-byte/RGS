# Local development services. Host ports are configurable in .env
# (Postgres defaults to 5433 to avoid clashing with a native Postgres on 5432).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: riad
      POSTGRES_PASSWORD: riad
      POSTGRES_DB: riad
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riad -d riad']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes images on Docker Hub; Chainguard maintains a build.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

  # --- The app itself, built from the Dockerfiles (production builds) ---
  # `docker compose up -d --build` (or the Play button in Docker Desktop) runs everything:
  # web on http://localhost:3200, API on http://localhost:4100. Same database and files as
  # `pnpm dev`, on other ports so both can run side by side. `pnpm db:up` starts only
  # postgres + minio for day-to-day development.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: riad-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://riad:riad@postgres:5432/riad?schema=public
      CORS_ORIGINS: http://localhost:3200
      COOKIE_SECURE: 'false'
      TRUST_PROXY: uniquelocal
      # The API reaches MinIO inside Docker; signed links point the browser to the host port.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_HOST_PORT:-9000}
    ports:
      - '${API_DOCKER_HOST_PORT:-4100}:4000'
    volumes:
      - ocrcache:/data/ocr
    depends_on:
      postgres: { condition: service_healthy }
      # The API creates its (private) buckets in MinIO when it starts.
      minio: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Live updates go straight to the API container: the Next.js proxy drops the
        # trailing slash Socket.io needs. (In production Caddy routes them instead.)
        NEXT_PUBLIC_SOCKET_URL: http://localhost:${API_DOCKER_HOST_PORT:-4100}
    image: riad-web:local
    restart: unless-stopped
    ports:
      - '${WEB_DOCKER_HOST_PORT:-3200}:3000'
    depends_on: [api]

  # Backups, to try them locally: docker compose --profile backup up -d --build backup
  # The local MinIO stands in for the off-server storage (bucket riad-offsite-test).
  backup:
    profiles: ['backup']
    build:
      context: ./deploy/backup
    image: riad-backup:local
    restart: unless-stopped
    environment: &backup-env
      PGHOST: postgres
      PGUSER: riad
      PGPASSWORD: riad
      PGDATABASE: riad
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      BACKUP_PASSPHRASE: local-test-passphrase
      BACKUP_S3_ENDPOINT: http://minio:9000
      BACKUP_S3_REGION: us-east-1
      BACKUP_S3_BUCKET: riad-offsite-test
      BACKUP_S3_PREFIX: local
      BACKUP_S3_ACCESS_KEY: minioadmin
      BACKUP_S3_SECRET_KEY: minioadmin
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  restore:
    profiles: ['restore']
    image: riad-backup:local
    entrypoint: ['/usr/local/bin/restore.sh']
    environment: *backup-env
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  ocrcache:
  backups:
